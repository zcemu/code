name: Build Win64 Portable NoAds

on:
  workflow_dispatch:

# 同一时间只运行一个构建，新任务取消旧任务
concurrency:
  group: modrinth-portable-win64
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-win64:
    name: Build Modrinth Portable Win64
    runs-on: windows-latest
    timeout-minutes: 120

    steps:
      # 1. 获取源码
      - name: Checkout source
        uses: actions/checkout@v4

      # 2. 安装 pnpm
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.11.2
          run_install: false

      # 3. 安装 Node
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # 4. 安装 Rust
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.95.0
          targets: x86_64-pc-windows-msvc

      # 5. Rust 缓存
      - name: Cache Rust
        uses: Swatinem/rust-cache@v2

      # 6. 检查环境
      - name: Verify toolchain
        shell: pwsh
        run: |
          node --version
          pnpm --version
          rustc --version
          cargo --version

      # 7. 安装依赖
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # 8. 配置生产环境
      - name: Setup production environment
        shell: pwsh
        run: |
          $source = "packages/app-lib/.env.prod"
          $destination = "packages/app-lib/.env"

          if (!(Test-Path $source)) {
            throw "Production environment file not found: $source"
          }

          Copy-Item $source $destination -Force

      # 9. 去广告及便携化补丁
      - name: Apply Portable and NoAds patches
        shell: pwsh
        run: |
          @'
          const fs = require('fs');

          function readFile(file) {
            if (!fs.existsSync(file)) {
              throw new Error(`File not found: ${file}`);
            }
            return fs.readFileSync(file, 'utf8');
          }

          function writeFile(file, content) {
            fs.writeFileSync(file, content, 'utf8');
          }

          function replaceOnce(content, regex, replacement, name) {
            const matches = content.match(regex);
            if (!matches || matches.length !== 1) {
              throw new Error(
                `${name}: expected exactly one match, found ${matches ? matches.length : 0}`
              );
            }
            return content.replace(regex, replacement);
          }

          // A. Tauri 配置
          const configPath = 'apps/app/tauri.conf.json';
          const config = JSON.parse(readFile(configPath));

          config.bundle = config.bundle || {};
          config.bundle.active = false;

          if (
            config.app &&
            config.app.security &&
            Array.isArray(config.app.security.capabilities)
          ) {
            config.app.security.capabilities =
              config.app.security.capabilities.filter(
                item => item !== 'ads'
              );
          }

          if (config.bundle.windows) {
            delete config.bundle.windows.portable;
          }

          writeFile(configPath, JSON.stringify(config, null, 2));

          // B. 移除 Rust 原生广告插件
          const mainPath = 'apps/app/src/main.rs';
          let rust = readFile(mainPath);

          rust = replaceOnce(
            rust,
            /^[ \t]*\.plugin\(api::ads::init\(\)\)[ \t]*,?\r?\n/m,
            '',
            'Native ads plugin'
          );

          // C. DATA 便携目录
          const mainMarker = 'fn main() {';

          if (!rust.includes(mainMarker)) {
            throw new Error('Rust main() not found');
          }

          if (rust.includes('THESEUS_CONFIG_DIR')) {
            throw new Error('Portable initialization already exists');
          }

          const portableCode = [
            '',
            '    #[cfg(target_os = "windows")]',
            '    {',
            '        let exe_dir = std::env::current_exe()',
            '            .expect("Cannot locate executable")',
            '            .parent()',
            '            .expect("Cannot locate executable directory")',
            '            .to_path_buf();',
            '',
            '        let data_dir = exe_dir.join("DATA");',
            '        let webview_dir = data_dir.join("webview2");',
            '',
            '        std::fs::create_dir_all(&data_dir)',
            '            .expect("Cannot create DATA directory");',
            '',
            '        std::fs::create_dir_all(&webview_dir)',
            '            .expect("Cannot create WebView2 directory");',
            '',
            '        unsafe {',
            '            std::env::set_var("THESEUS_CONFIG_DIR", &data_dir);',
            '            std::env::set_var(',
            '                "WEBVIEW2_USER_DATA_FOLDER",',
            '                &webview_dir',
            '            );',
            '        }',
            '    }',
            ''
          ].join('\n');

          rust = rust.replace(mainMarker, mainMarker + portableCode);
          writeFile(mainPath, rust);

          // D. 前端关闭广告显示
          const appVuePath = 'apps/app-frontend/src/App.vue';
          let appVue = readFile(appVuePath);

          const showAdPattern =
            /const showAd\s*=\s*computed\(\s*\(\)\s*=>\s*sidebarVisible\.value\s*&&\s*!hasPlus\.value\s*&&\s*credentials\.value\s*!==\s*undefined,\s*\)/m;

          appVue = replaceOnce(
            appVue,
            showAdPattern,
            'const showAd = computed(() => false)',
            'Frontend showAd'
          );

          const consentPattern =
            /const adConsentAvailable\s*=\s*computed\(\s*\(\)\s*=>\s*credentials\.value\s*!==\s*undefined\s*&&\s*!hasPlus\.value\s*\)/m;

          appVue = replaceOnce(
            appVue,
            consentPattern,
            'const adConsentAvailable = computed(() => false)',
            'Frontend ad consent'
          );

          writeFile(appVuePath, appVue);

          // E. 广告辅助函数改为空操作
          const adsPath = 'apps/app-frontend/src/helpers/ads.js';
          const originalAds = readFile(adsPath);

          const exportedFunctions = [
            ...originalAds.matchAll(
              /^\s*export\s+(?:async\s+)?function\s+([A-Za-z_$][\w$]*)\s*\(/gm
            )
          ].map(match => match[1]);

          if (exportedFunctions.length === 0) {
            throw new Error('No exported ads functions found');
          }

          const uniqueFunctions = [...new Set(exportedFunctions)];

          const stubCode = uniqueFunctions.map(name => {
            const result =
              name === 'should_show_ads_consent_popup'
                ? 'false'
                : 'undefined';

            return `export async function ${name}(...args) { return ${result}; }`;
          }).join('\n') + '\n';

          writeFile(adsPath, stubCode);

          // F. 移除 Plus Banner
          let bannerCount = 0;

          function walk(dir) {
            if (!fs.existsSync(dir)) return;

            for (const entry of fs.readdirSync(dir, {
              withFileTypes: true
            })) {
              const full = `${dir}/${entry.name}`;

              if (entry.isDirectory()) {
                if (
                  ['node_modules', '.turbo', 'dist'].includes(entry.name)
                ) {
                  continue;
                }
                walk(full);
                continue;
              }

              if (!entry.isFile() || !full.endsWith('.vue')) {
                continue;
              }

              let content = readFile(full);
              const original = content;

              content = content.replace(
                /<ModrinthPlusBanner\b[^>]*\/>/g,
                ''
              );

              content = content.replace(
                /<ModrinthPlusBanner\b[^>]*>[\s\S]*?<\/ModrinthPlusBanner\s*>/g,
                ''
              );

              if (content !== original) {
                writeFile(full, content);
                bannerCount++;
              }
            }
          }

          walk('apps/app-frontend/src');

          console.log('Portable DATA directory configured');
          console.log('Native ads plugin disabled');
          console.log('Frontend ads disabled');
          console.log('Disabled ads helper functions:', uniqueFunctions.length);
          console.log('Plus Banner files modified:', bannerCount);
          console.log('All patches completed successfully');
          '@ | node -

      # 10. 编译 Modrinth App
      - name: Build Tauri app
        run: pnpm app:build

      # 11. 自动查找 EXE 并制作绿色版
      - name: Package Portable ZIP
        shell: pwsh
        run: |
          $searchRoots = @(
            "target",
            "apps/app/target"
          )

          $exe = $null

          foreach ($root in $searchRoots) {
            if (!(Test-Path $root)) {
              continue
            }

            $candidates = Get-ChildItem `
              -Path $root `
              -Filter "*.exe" `
              -File `
              -Recurse |
              Where-Object {
                $_.BaseName -eq "Modrinth App" -or
                $_.BaseName -eq "theseus_gui"
              }

            if ($candidates) {
              $exe = $candidates |
                Sort-Object {
                  if ($_.BaseName -eq "Modrinth App") {
                    0
                  } else {
                    1
                  }
                } |
                Select-Object -First 1

              break
            }
          }

          if (!$exe) {
            Write-Host "Executable candidates found:"

            foreach ($root in $searchRoots) {
              if (Test-Path $root) {
                Get-ChildItem $root -Filter "*.exe" -File -Recurse |
                  Select-Object -ExpandProperty FullName |
                  Write-Host
              }
            }

            throw "Modrinth App executable not found"
          }

          Write-Host "Found executable:"
          Write-Host $exe.FullName

          $binaryDir = $exe.DirectoryName
          $packageDir = "Modrinth-Portable"

          if (Test-Path $packageDir) {
            Remove-Item $packageDir -Recurse -Force
          }

          New-Item -ItemType Directory -Force `
            "$packageDir/DATA" | Out-Null

          Copy-Item `
            -LiteralPath $exe.FullName `
            -Destination "$packageDir/Modrinth App.exe"

          Get-ChildItem `
            -Path $binaryDir `
            -Filter "*.dll" `
            -File |
            ForEach-Object {
              Copy-Item `
                -LiteralPath $_.FullName `
                -Destination $packageDir
            }

          @"
          Modrinth App Portable NoAds

          Run Modrinth App.exe directly.

          DATA folder must remain next to the executable.
          Back up the entire folder to preserve your data.

          Windows WebView2 Runtime is required.
          "@ | Set-Content `
            "$packageDir/README.txt" `
            -Encoding UTF8

          $zip = "Modrinth-Win64-Portable-NoAds.zip"

          if (Test-Path $zip) {
            Remove-Item $zip -Force
          }

          Compress-Archive `
            -Path "$packageDir/*" `
            -DestinationPath $zip `
            -CompressionLevel Optimal `
            -Force

          if (!(Test-Path $zip)) {
            throw "ZIP creation failed"
          }

          Write-Host "Portable ZIP created successfully"
          Write-Host "Size: $((Get-Item $zip).Length / 1MB) MB"

      # 12. 生成 SHA256 校验文件
      - name: Generate SHA256 checksum
        shell: pwsh
        run: |
          $zip = "Modrinth-Win64-Portable-NoAds.zip"

          if (!(Test-Path $zip)) {
            throw "Portable ZIP not found"
          }

          $hash = (Get-FileHash `
            -Path $zip `
            -Algorithm SHA256).Hash.ToLowerInvariant()

          "$hash  $zip" | Set-Content `
            "$zip.sha256" `
            -Encoding ascii

          Write-Host "SHA256: $hash"

      # 13. 上传 Actions 构建产物
      - name: Upload ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: Modrinth-Win64-Portable-NoAds
          path: |
            Modrinth-Win64-Portable-NoAds.zip
            Modrinth-Win64-Portable-NoAds.zip.sha256
          if-no-files-found: error
          retention-days: 14

      # 14. 发布 GitHub Release
      - name: Modrinth App v${{ env.APP_VERSION }} - Win64 Portable NoAds
        uses: softprops/action-gh-release@v3
        with:
          tag_name: portable-win64-noads
          target_commitish: ${{ github.sha }}
          name: Modrinth Win64 Portable NoAds

          body: |
            ## 下载绿色版

            **[点击下载 Modrinth Win64 Portable NoAds](https://github.com/${{ github.repository }}/releases/download/portable-win64-noads/Modrinth-Win64-Portable-NoAds.zip)**

            ## 文件说明

            - `Modrinth-Win64-Portable-NoAds.zip`：Windows 64 位便携版
            - `Modrinth-Win64-Portable-NoAds.zip.sha256`：SHA256 校验文件

            ## 使用说明

            1. 下载 ZIP 并解压。
            2. 运行 `Modrinth App.exe`。
            3. 请保留旁边的 `DATA` 文件夹。
            4. 更换硬盘或重装系统前，备份整个程序文件夹。

            Windows WebView2 Runtime 为运行所需依赖。

            ## 构建信息

            - Build commit: `${{ github.sha }}`
            - Platform: Windows x64
            - Build type: Portable / NoAds

          prerelease: true
          make_latest: false
          overwrite_files: true
          fail_on_unmatched_files: true
          generate_release_notes: false

          files: |
            Modrinth-Win64-Portable-NoAds.zip
            Modrinth-Win64-Portable-NoAds.zip.sha256
