
name: Build Win64 Portable NoAds

on:
  workflow_dispatch:

concurrency:
  group: modrinth-portable-win64
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-win64:
    name: Build Modrinth Portable Win64
    runs-on: windows-latest
    timeout-minutes: 120

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.11.2
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.95.0
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2

      - name: Verify toolchain
        shell: pwsh
        run: |
          node --version
          pnpm --version
          rustc --version
          cargo --version

      # 关键修复：编译前同步官方正式版本号
      - name: Set official Modrinth App version
        id: version
        shell: pwsh
        run: |
          $headers = @{
            "Accept" = "application/vnd.github+json"
            "User-Agent" = "zcemu-portable-build"
          }

          $release = Invoke-RestMethod `
            -Uri "https://api.github.com/repos/modrinth/code/releases/latest" `
            -Headers $headers

          $tag = $release.tag_name

          if ([string]::IsNullOrWhiteSpace($tag)) {
            throw "Cannot obtain official Modrinth release version"
          }

          $version = $tag -replace '^v', ''

          if ($version -match 'local|canary|dev') {
            throw "Invalid official version: $version"
          }

          Write-Host "Official Modrinth version: $version"

          # 修改前端 package.json
          $frontendPath = "apps/app-frontend/package.json"
          $frontend = Get-Content $frontendPath -Raw | ConvertFrom-Json
          $frontend.version = $version
          $frontend | ConvertTo-Json -Depth 100 |
            Set-Content $frontendPath -Encoding UTF8

          # 修改 Rust 主程序版本
          $cargoPath = "apps/app/Cargo.toml"
          $cargo = Get-Content $cargoPath -Raw
          $cargo = [regex]::Replace(
            $cargo,
            '(?m)^version\s*=\s*"[^"]+"',
            "version = `"$version`"",
            1
          )
          Set-Content $cargoPath $cargo -Encoding UTF8

          # 修改 app-lib 版本
          $libPath = "packages/app-lib/Cargo.toml"
          $lib = Get-Content $libPath -Raw
          $lib = [regex]::Replace(
            $lib,
            '(?m)^version\s*=\s*"[^"]+"',
            "version = `"$version`"",
            1
          )
          Set-Content $libPath $lib -Encoding UTF8

          # 检查三个文件
          $frontendCheck = (Get-Content $frontendPath -Raw | ConvertFrom-Json).version
          $cargoCheck = [regex]::Match(
            (Get-Content $cargoPath -Raw),
            '(?m)^version\s*=\s*"([^"]+)"'
          ).Groups[1].Value
          $libCheck = [regex]::Match(
            (Get-Content $libPath -Raw),
            '(?m)^version\s*=\s*"([^"]+)"'
          ).Groups[1].Value

          Write-Host "Frontend version: $frontendCheck"
          Write-Host "Rust app version: $cargoCheck"
          Write-Host "App-lib version: $libCheck"

          if (
            $frontendCheck -ne $version -or
            $cargoCheck -ne $version -or
            $libCheck -ne $version
          ) {
            throw "Application version synchronization failed"
          }

          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup production environment
        shell: pwsh
        run: |
          $source = "packages/app-lib/.env.prod"
          $destination = "packages/app-lib/.env"

          if (!(Test-Path $source)) {
            throw "Production environment file not found: $source"
          }

          Copy-Item $source $destination -Force

      # 去广告及便携化补丁
      - name: Apply Portable and NoAds patches
        shell: pwsh
        run: |
          @'
          const fs = require('fs');

          function readFile(file) {
            if (!fs.existsSync(file)) {
              throw new Error(`File not found: ${file}`);
            }
            return fs.readFileSync(file, 'utf8');
          }

          function writeFile(file, content) {
            fs.writeFileSync(file, content, 'utf8');
          }

          function replaceOnce(content, regex, replacement, name) {
            const matches = content.match(regex);
            if (!matches || matches.length !== 1) {
              throw new Error(
                `${name}: expected exactly one match, found ${matches ? matches.length : 0}`
              );
            }
            return content.replace(regex, replacement);
          }

          // A. Tauri 配置
          const configPath = 'apps/app/tauri.conf.json';
          const config = JSON.parse(readFile(configPath));

          config.bundle = config.bundle || {};
          config.bundle.active = false;

          if (
            config.app &&
            config.app.security &&
            Array.isArray(config.app.security.capabilities)
          ) {
            config.app.security.capabilities =
              config.app.security.capabilities.filter(
                item => item !== 'ads'
              );
          }

          writeFile(configPath, JSON.stringify(config, null, 2));

          // B. 移除 Rust 原生广告插件
          const mainPath = 'apps/app/src/main.rs';
          let rust = readFile(mainPath);

          rust = replaceOnce(
            rust,
            /^[ \t]*\.plugin\(api::ads::init\(\)\)[ \t]*,?\r?\n/m,
            '',
            'Native ads plugin'
          );

          // C. DATA 便携目录
          const mainMarker = 'fn main() {';

          if (!rust.includes(mainMarker)) {
            throw new Error('Rust main() not found');
          }

          if (rust.includes('THESEUS_CONFIG_DIR')) {
            throw new Error('Portable initialization already exists');
          }

          const portableCode = [
            '',
            '    #[cfg(target_os = "windows")]',
            '    {',
            '        let exe_dir = std::env::current_exe()',
            '            .expect("Cannot locate executable")',
            '            .parent()',
            '            .expect("Cannot locate executable directory")',
            '            .to_path_buf();',
            '',
            '        let data_dir = exe_dir.join("DATA");',
            '        let webview_dir = data_dir.join("webview2");',
            '',
            '        std::fs::create_dir_all(&data_dir)',
            '            .expect("Cannot create DATA directory");',
            '',
            '        std::fs::create_dir_all(&webview_dir)',
            '            .expect("Cannot create WebView2 directory");',
            '',
            '        unsafe {',
            '            std::env::set_var("THESEUS_CONFIG_DIR", &data_dir);',
            '            std::env::set_var(',
            '                "WEBVIEW2_USER_DATA_FOLDER",',
            '                &webview_dir',
            '            );',
            '        }',
            '    }',
            ''
          ].join('\n');

          rust = rust.replace(mainMarker, mainMarker + portableCode);
          writeFile(mainPath, rust);

          // D. 前端关闭广告显示
          const appVuePath = 'apps/app-frontend/src/App.vue';
          let appVue = readFile(appVuePath);

          appVue = replaceOnce(
            appVue,
            /const showAd\s*=\s*computed\(\s*\(\)\s*=>\s*sidebarVisible\.value\s*&&\s*!hasPlus\.value\s*&&\s*credentials\.value\s*!==\s*undefined,\s*\)/m,
            'const showAd = computed(() => false)',
            'Frontend showAd'
          );

          appVue = replaceOnce(
            appVue,
            /const adConsentAvailable\s*=\s*computed\(\s*\(\)\s*=>\s*credentials\.value\s*!==\s*undefined\s*&&\s*!hasPlus\.value\s*\)/m,
            'const adConsentAvailable = computed(() => false)',
            'Frontend ad consent'
          );

          writeFile(appVuePath, appVue);

          // E. 广告辅助函数改为空操作
          const adsPath = 'apps/app-frontend/src/helpers/ads.js';
          const originalAds = readFile(adsPath);

          const exportedFunctions = [
            ...originalAds.matchAll(
              /^\s*export\s+(?:async\s+)?function\s+([A-Za-z_$][\w$]*)\s*\(/gm
            )
          ].map(match => match[1]);

          if (exportedFunctions.length === 0) {
            throw new Error('No exported ads functions found');
          }

          const uniqueFunctions = [...new Set(exportedFunctions)];

          const stubCode = uniqueFunctions.map(name => {
            const result =
              name === 'should_show_ads_consent_popup'
                ? 'false'
                : 'undefined';

            return `export async function ${name}(...args) { return ${result}; }`;
          }).join('\n') + '\n';

          writeFile(adsPath, stubCode);

          // F. 移除 Plus Banner
          let bannerCount = 0;

          function walk(dir) {
            if (!fs.existsSync(dir)) return;

            for (const entry of fs.readdirSync(dir, {
              withFileTypes: true
            })) {
              const full = `${dir}/${entry.name}`;

              if (entry.isDirectory()) {
                if (
                  ['node_modules', '.turbo', 'dist'].includes(entry.name)
                ) {
                  continue;
                }
                walk(full);
                continue;
              }

              if (!entry.isFile() || !full.endsWith('.vue')) {
                continue;
              }

              let content = readFile(full);
              const original = content;

              content = content.replace(
                /<ModrinthPlusBanner\b[^>]*\/>/g,
                ''
              );

              content = content.replace(
                /<ModrinthPlusBanner\b[^>]*>[\s\S]*?<\/ModrinthPlusBanner\s*>/g,
                ''
              );

              if (content !== original) {
                writeFile(full, content);
                bannerCount++;
              }
            }
          }

          walk('apps/app-frontend/src');

          console.log('Portable DATA directory configured');
          console.log('Native ads plugin disabled');
          console.log('Frontend ads disabled');
          console.log('Disabled ads helper functions:', uniqueFunctions.length);
          console.log('Plus Banner files modified:', bannerCount);
          console.log('All patches completed successfully');
          '@ | node -

      # 构建
      - name: Build Tauri app
        run: pnpm app:build

      # 打包绿色版
      - name: Package Portable ZIP
        shell: pwsh
        run: |
          $searchRoots = @(
            "target",
            "apps/app/target"
          )

          $exe = $null

          foreach ($root in $searchRoots) {
            if (!(Test-Path $root)) {
              continue
            }

            $candidates = Get-ChildItem `
              -Path $root `
              -Filter "*.exe" `
              -File `
              -Recurse |
              Where-Object {
                $_.BaseName -eq "Modrinth App" -or
                $_.BaseName -eq "theseus_gui"
              }

            if ($candidates) {
              $exe = $candidates |
                Sort-Object {
                  if ($_.BaseName -eq "Modrinth App") {
                    0
                  } else {
                    1
                  }
                } |
                Select-Object -First 1

              break
            }
          }

          if (!$exe) {
            Write-Host "Executable candidates found:"
            foreach ($root in $searchRoots) {
              if (Test-Path $root) {
                Get-ChildItem $root -Filter "*.exe" -File -Recurse |
                  Select-Object -ExpandProperty FullName |
                  Write-Host
              }
            }
            throw "Modrinth App executable not found"
          }

          Write-Host "Found executable:"
          Write-Host $exe.FullName

          $binaryDir = $exe.DirectoryName
          $packageDir = "Modrinth-Portable"

          if (Test-Path $packageDir) {
            Remove-Item $packageDir -Recurse -Force
          }

          New-Item -ItemType Directory -Force "$packageDir/DATA" |
            Out-Null

          Copy-Item -LiteralPath $exe.FullName `
            -Destination "$packageDir/Modrinth App.exe"

          Get-ChildItem -Path $binaryDir -Filter "*.dll" -File |
            ForEach-Object {
              Copy-Item -LiteralPath $_.FullName -Destination $packageDir
            }

          @"
          Modrinth App Portable NoAds

          Run Modrinth App.exe directly.

          DATA folder must remain next to the executable.
          Back up the entire folder to preserve your data.
          Windows WebView2 Runtime is required.
          "@ | Set-Content "$packageDir/README.txt" -Encoding UTF8

          $zip = "Modrinth-Win64-Portable-NoAds.zip"

          if (Test-Path $zip) {
            Remove-Item $zip -Force
          }

          Compress-Archive `
            -Path "$packageDir/*" `
            -DestinationPath $zip `
            -CompressionLevel Optimal `
            -Force

          if (!(Test-Path $zip)) {
            throw "ZIP creation failed"
          }

          Write-Host "Portable ZIP created successfully"
          Write-Host "Size: $((Get-Item $zip).Length / 1MB) MB"

      - name: Verify application version
        shell: pwsh
        run: |
          $expected = "${{ steps.version.outputs.version }}"

          $frontend = (Get-Content "apps/app-frontend/package.json" -Raw |
            ConvertFrom-Json).version

          if ($frontend -ne $expected) {
            throw "Version mismatch: expected $expected, got $frontend"
          }

          Write-Host "Verified application version: $expected"

      - name: Generate SHA256 checksum
        shell: pwsh
        run: |
          $zip = "Modrinth-Win64-Portable-NoAds.zip"

          if (!(Test-Path $zip)) {
            throw "Portable ZIP not found"
          }

          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()

          "$hash  $zip" | Set-Content "$zip.sha256" -Encoding ascii

          Write-Host "SHA256: $hash"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: portable-win64-noads
          name: Modrinth App v${{ steps.version.outputs.version }} - Win64 Portable NoAds
          target_commitish: ${{ github.sha }}
          prerelease: false
          make_latest: false
          overwrite_files: true
          fail_on_unmatched_files: true
          generate_release_notes: false
          body: |
            ## Modrinth App v${{ steps.version.outputs.version }}

            **[直接下载 Windows x64 便携版](https://github.com/${{ github.repository }}/releases/download/portable-win64-noads/Modrinth-Win64-Portable-NoAds.zip)**

            ### 文件说明
            - Modrinth-Win64-Portable-NoAds.zip：便携版
            - Modrinth-Win64-Portable-NoAds.zip.sha256：SHA256 校验文件

            ### 使用说明
            1. 下载并解压 ZIP。
            2. 运行 Modrinth App.exe。
            3. 保留 EXE 旁边的 DATA 文件夹。
            4. 备份整个程序文件夹即可迁移数据。

            ### 构建信息
            - Official version: ${{ steps.version.outputs.version }}
            - Commit: ${{ github.sha }}
            - Platform: Windows x64
            - Build: Portable / NoAds

          files: |
            Modrinth-Win64-Portable-NoAds.zip
            Modrinth-Win64-Portable-NoAds.zip.sha256
