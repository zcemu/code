name: Build Win64 Portable (No Ads)
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build-win64:
    runs-on: windows-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        # 重点：移除 version 字段，自动读取 package.json 的 pnpm@12.11.2
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - name: Install Tauri CLI
        run: cargo install tauri-cli --locked

      - name: Install dependencies
        run: pnpm install

      - name: Apply patch（开启便携 + 移除广告Plus横幅）
        run: bash scripts/patch.sh

      - name: Build Tauri app
        run: pnpm app:build

      - name: Upload portable zip to Release
        uses: softprops/action-gh-release@v2
        with:
          name: Win64 Portable NoAds
          generate_release_notes: false
          files: |
            apps/app/src-tauri/target/release/bundle/zip/*.zip
