name: Build Win64 Portable (No Ads)
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build-win64:
    runs-on: windows-latest
    env:
      PNPM_IGNORE_PACKAGE_MANAGER_CHECK: true
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install Tauri CLI
        run: cargo install tauri-cli --locked

      - name: Install dependencies
        run: pnpm install

      - name: Apply all patches (inline fixed)
        run: |
          node -e "
            const fs = require('fs');
            const p = 'apps/app/tauri.conf.json';
            const cfg = JSON.parse(fs.readFileSync(p, 'utf8'));
            if (!cfg.bundle) cfg.bundle = {};
            if (!cfg.bundle.windows) cfg.bundle.windows = {};
            cfg.bundle.windows.portable = true;
            fs.writeFileSync(p, JSON.stringify(cfg, null, 2), 'utf8');
            console.log('✅ Portable enabled');
          "
          sed -i 's/init_ads();/\/\/ init_ads();/' apps/app/src/main.rs
          echo "" > apps/frontend/src/public/promo-frame.html
          find apps/frontend/src -type f -name "*.vue" -exec sed -i 's/<ModrinthPlusBanner /<!-- <ModrinthPlusBanner /g' {} \;
          find apps/frontend/src -type f -name "*.vue" -exec sed -i 's/\/ModrinthPlusBanner>/\/ModrinthPlusBanner -->/g' {} \;

      - name: Build Tauri app
        run: pnpm app:build

      - name: Upload portable zip to Release
        uses: softprops/action-gh-release@v2
        with:
          name: Win64 Portable NoAds
          generate_release_notes: false
          files: |
            apps/app/src-tauri/target/release/bundle/zip/*.zip
